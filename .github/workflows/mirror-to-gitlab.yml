name: Mirror repository to GitLab

on:
  # Wird bei Pushes auf jedem Branch und bei allen Tags ausgelöst.
  push:

  # Stellt sicher, dass auch gelöschte Branches und Tags synchronisiert werden.
  delete:

  # Ermöglicht einen manuellen Start über die GitHub-Oberfläche.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitlab-mirror
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror all branches and tags
    runs-on: ubuntu-latest

    steps:
      - name: Create bare clone of GitHub repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --bare \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            repository.git

      - name: Configure GitLab remote
        working-directory: repository.git
        env:
          GITLAB_USERNAME: ${{ secrets.GITLAB_USERNAME }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_REPOSITORY_URL: ${{ secrets.GITLAB_REPOSITORY_URL }}
        run: |
          AUTHENTICATED_URL="$(
            echo "${GITLAB_REPOSITORY_URL}" |
            sed "s#https://#https://${GITLAB_USERNAME}:${GITLAB_TOKEN}@#"
          )"

          git remote add gitlab "${AUTHENTICATED_URL}"

      - name: Mirror all branches
        working-directory: repository.git
        run: |
          git push \
            --prune \
            gitlab \
            "+refs/heads/*:refs/heads/*"

      - name: Mirror all tags
        working-directory: repository.git
        run: |
          git push \
            --prune \
            gitlab \
            "+refs/tags/*:refs/tags/*"
